<style>
:root{--bg-primary:#1a1a2e;--bg-secondary:#16213e;--bg-card:#1e2a3a;--text-primary:#e8e8e8;--text-secondary:#a0a0b0;--accent:#00d4aa;--accent-dim:#00d4aa22;--code-bg:#0d1117;--code-text:#c9d1d9;--orange:#f0a050;--orange-dim:#f0a05022;--green:#00d4aa;--green-dim:#00d4aa22;--gray:#555;--red:#ff6b6b;--sidebar-width:300px;--transition-speed:200ms}.light-mode{--bg-primary:#f5f5f5;--bg-secondary:#e8e8e8;--bg-card:#fff;--text-primary:#1a1a2e;--text-secondary:#555;--code-bg:#f0f0f0;--code-text:#333;--accent-dim:#00d4aa22;--orange-dim:#f0a05022;--green-dim:#00d4aa22}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-primary);color:var(--text-primary);display:flex;height:100vh;overflow:hidden;transition:background var(--transition-speed),color var(--transition-speed)}.sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);background:var(--bg-secondary);display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.05);transition:transform var(--transition-speed),background var(--transition-speed);z-index:10}.sidebar-header{padding:16px;border-bottom:1px solid rgba(255,255,255,.05);font-size:15px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px}.sidebar-header span{font-size:12px;color:var(--text-secondary);font-weight:400}.topic-list{flex:1;overflow-y:auto;padding:8px 0}.topic-list::-webkit-scrollbar{width:4px}.topic-list::-webkit-scrollbar-thumb{background:var(--gray);border-radius:2px}.topic-item{display:flex;align-items:center;padding:10px 16px;cursor:pointer;border-left:3px solid transparent;transition:all 150ms;gap:10px;font-size:13px}.topic-item:hover{background:rgba(255,255,255,.03)}.topic-item.active{background:var(--accent-dim);border-left-color:var(--accent);color:var(--accent)}.topic-num{font-size:11px;font-weight:700;color:var(--text-secondary);min-width:20px}.topic-title{flex:1;line-height:1.3}.topic-progress{font-size:11px;color:var(--text-secondary);white-space:nowrap}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--gray);flex-shrink:0}.status-dot.in-progress{background:var(--orange)}.status-dot.done{background:var(--green)}.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.05)}.reset-btn{width:100%;padding:8px;background:0 0;border:1px solid var(--red);color:var(--red);border-radius:6px;cursor:pointer;font-size:12px;transition:all 150ms}.reset-btn:hover{background:var(--red);color:#fff}.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}.progress-bar-container{height:3px;background:rgba(255,255,255,.05)}.progress-bar-fill{height:100%;background:var(--accent);transition:width 400ms ease;width:0}.top-bar{display:flex;align-items:center;padding:10px 24px;border-bottom:1px solid rgba(255,255,255,.05);gap:12px;flex-shrink:0}.hamburger{display:none;background:0 0;border:none;color:var(--text-primary);font-size:20px;cursor:pointer;padding:4px}.progress-text{font-size:13px;color:var(--text-secondary);flex:1}.progress-text b{color:var(--accent)}.shortcuts-hint{font-size:11px;color:var(--text-secondary)}.shortcuts-hint kbd{background:var(--bg-card);padding:1px 5px;border-radius:3px;border:1px solid rgba(255,255,255,.1);font-size:10px;font-family:monospace}.card-area{flex:1;overflow-y:auto;padding:24px;display:flex;justify-content:center}.card-area::-webkit-scrollbar{width:6px}.card-area::-webkit-scrollbar-thumb{background:var(--gray);border-radius:3px}.card-wrapper{max-width:760px;width:100%;animation:slideIn var(--transition-speed) ease}@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}@keyframes slideInReverse{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}.card-wrapper.reverse{animation-name:slideInReverse}.section-badge{display:inline-block;padding:3px 10px;background:var(--accent-dim);color:var(--accent);border-radius:12px;font-size:11px;font-weight:600;margin-bottom:12px}.card{background:var(--bg-card);border-radius:12px;padding:28px;border:1px solid rgba(255,255,255,.05);transition:background var(--transition-speed)}.card h2{font-size:22px;font-weight:700;margin-bottom:16px;line-height:1.3}.card-concept{font-size:15px;line-height:1.7;color:var(--text-primary);margin-bottom:16px}.card-concept code{background:var(--code-bg);color:var(--accent);padding:1px 5px;border-radius:3px;font-size:13px;font-family:'SF Mono','Fira Code',monospace}.card-concept ul,.card-concept ol{margin:8px 0 8px 20px}.card-concept li{margin:4px 0}.card-concept b,.card-concept strong{color:var(--accent)}.toggle-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--text-secondary);border-radius:6px;cursor:pointer;font-size:13px;margin-right:8px;margin-bottom:8px;transition:all 150ms}.toggle-btn:hover{background:rgba(255,255,255,.08);color:var(--text-primary)}.toggle-btn.active{border-color:var(--accent);color:var(--accent)}.collapsible{max-height:0;overflow:hidden;transition:max-height 300ms ease,opacity 200ms;opacity:0}.collapsible.open{max-height:2000px;opacity:1}.code-block{background:var(--code-bg);border-radius:8px;padding:16px;margin:12px 0;overflow-x:auto;font-family:'SF Mono','Fira Code',Consolas,monospace;font-size:13px;line-height:1.5;color:var(--code-text);border:1px solid rgba(255,255,255,.05);white-space:pre}.code-block::-webkit-scrollbar{height:4px}.code-block::-webkit-scrollbar-thumb{background:var(--gray)}.tip-box{background:rgba(240,160,80,.08);border-left:3px solid var(--orange);border-radius:0 8px 8px 0;padding:12px 16px;margin:12px 0;font-size:14px;line-height:1.6}.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.05);flex-wrap:wrap;gap:10px}.action-buttons{display:flex;gap:8px}.action-btn{padding:10px 20px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all 150ms;display:flex;align-items:center;gap:6px}.action-btn.got-it{background:var(--green);color:#0a1628}.action-btn.got-it:hover{filter:brightness(1.15)}.action-btn.revisit{background:var(--orange);color:#1a1a2e}.action-btn.revisit:hover{filter:brightness(1.15)}.nav-controls{display:flex;align-items:center;gap:12px}.nav-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all 150ms}.nav-btn:hover{background:rgba(255,255,255,.1);color:var(--text-primary)}.nav-btn:disabled{opacity:.3;cursor:not-allowed}.card-counter{font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums}.kw{color:#ff7b72}.str{color:#a5d6ff}.cmt{color:#8b949e;font-style:italic}.ann{color:#d2a8ff}.num{color:#79c0ff}.type{color:#ffa657}.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9}@media(max-width:768px){.sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.sidebar-overlay.open{display:block}.hamburger{display:block}.shortcuts-hint{display:none}.card-area{padding:16px}.card{padding:20px}.card h2{font-size:18px}}.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}.confirm-overlay.open{display:flex}.confirm-dialog{background:var(--bg-card);border-radius:12px;padding:24px;max-width:360px;text-align:center;border:1px solid rgba(255,255,255,.1)}.confirm-dialog h3{margin-bottom:12px}.confirm-dialog p{color:var(--text-secondary);font-size:14px;margin-bottom:20px}.confirm-dialog .btn-row{display:flex;gap:12px;justify-content:center}.confirm-dialog button{padding:8px 20px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:600}.confirm-dialog .cancel-btn{background:rgba(255,255,255,.1);color:var(--text-primary)}.confirm-dialog .danger-btn{background:var(--red);color:#fff}
</style>

<script>
const TOPICS=[{"id":"android-fundamentals","number":1,"title":"Android Fundamentals","sections":[{"id":"activity-lifecycle","title":"Activity Lifecycle","cards":[{"id":"af-1","title":"Activity Lifecycle Callbacks","concept":"The full Activity lifecycle:<br><br><b>onCreate()</b> — Activity first created. Initialize views. Bundle is non-null on recreation.<br><b>onStart()</b> — VISIBLE but not interactive.<br><b>onResume()</b> — FOREGROUND and interactive.<br><b>onPause()</b> — PARTIALLY VISIBLE (dialog/multi-window). Keep fast.<br><b>onStop()</b> — NO LONGER VISIBLE. DB writes, analytics.<br><b>onDestroy()</b> — Being destroyed. <code>isFinishing</code> distinguishes user-nav vs config change.<br><b>onRestart()</b> — Coming back from STOPPED.","code":"override fun onCreate(savedInstanceState: Bundle?) {\n    super.onCreate(savedInstanceState)\n    setContentView(R.layout.activity_main)\n    if (savedInstanceState != null) {\n        val scrollPos = savedInstanceState.getInt(\"SCROLL_POS\", 0)\n        restoreUIState(scrollPos)\n    }\n}\n\noverride fun onSaveInstanceState(outState: Bundle) {\n    super.onSaveInstanceState(outState)\n    outState.putInt(\"SCROLL_POS\", getCurrentScrollPosition())\n}","tip":"Draw the lifecycle on whiteboard. Know which callbacks are GUARANTEED (onPause, onStop) vs NOT guaranteed (onDestroy). onSaveInstanceState is called after onStop on API 28+."},{"id":"af-2","title":"Activity A Launches Activity B","concept":"When A launches opaque B:<br><code>A.onPause() → B.onCreate() → B.onStart() → B.onResume() → A.onStop()</code><br><br>If B is transparent: A only reaches onPause, never onStop.<br><br>Back from B: <code>B.onPause() → A.onRestart() → A.onStart() → A.onResume() → B.onStop() → B.onDestroy()</code>","code":null,"tip":"A.onStop() only fires when A is COMPLETELY invisible. If B is translucent, A stays PAUSED. This is a top-tier Google question."}]},{"id":"fragment-lifecycle","title":"Fragment Lifecycle","cards":[{"id":"af-3","title":"Fragment View vs Instance Lifecycle","concept":"Fragment VIEW lifecycle != Fragment INSTANCE lifecycle. When on backstack, view is destroyed but instance stays alive — the #1 source of Fragment memory leaks.<br><br>Always use <code>viewLifecycleOwner</code> (not <code>this</code>) for UI observations. Null out <code>_binding</code> in onDestroyView.","code":"override fun onViewCreated(view: View, savedInstanceState: Bundle?) {\n    _binding = FragmentExampleBinding.bind(view)\n    viewLifecycleOwner.lifecycleScope.launch {\n        viewLifecycleOwner.repeatOnLifecycle(Lifecycle.State.STARTED) {\n            viewModel.uiState.collect { updateUI(it) }\n        }\n    }\n}\n\noverride fun onDestroyView() {\n    super.onDestroyView()\n    _binding = null // Prevent memory leak\n}","tip":"Using 'this' instead of viewLifecycleOwner causes multiple active observers after backstack navigation."}]},{"id":"config-changes","title":"Configuration Changes & State","cards":[{"id":"af-4","title":"State Preservation Layers","concept":"Three layers:<br>1. <b>ViewModel</b> — Survives config change. NOT process death.<br>2. <b>onSaveInstanceState / Bundle</b> — Survives config change AND process death. ~1MB limit.<br>3. <b>Persistent storage</b> (Room, DataStore) — Survives everything.<br><br><b>SavedStateHandle</b> in ViewModel bridges layers 1 and 2.","code":"class RobustViewModel(\n    private val savedStateHandle: SavedStateHandle\n) : ViewModel() {\n    private val _items = MutableStateFlow<List<Item>>(emptyList())\n    val searchQuery: StateFlow<String> =\n        savedStateHandle.getStateFlow(\"search_query\", \"\")\n    fun updateSearchQuery(query: String) {\n        savedStateHandle[\"search_query\"] = query\n    }\n}","tip":"ViewModel memory = fetched data (re-fetchable). SavedStateHandle = user input, scroll position. Room/DataStore = preferences, cached API data."}]},{"id":"intent-system","title":"Intent System","cards":[{"id":"af-5","title":"Intents & PendingIntent","concept":"<b>Explicit Intent</b> — targets specific component. In-app navigation.<br><b>Implicit Intent</b> — declares action; system finds handlers. Check resolveActivity() first.<br><br><b>PendingIntent flags:</b> FLAG_IMMUTABLE (API 31+ default), FLAG_MUTABLE (inline reply), FLAG_UPDATE_CURRENT, FLAG_ONE_SHOT.","code":"val pi = PendingIntent.getActivity(\n    context, 0, intent,\n    PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT\n)","tip":"API 31+ requires explicit mutability flag. Use FLAG_IMMUTABLE by default, FLAG_MUTABLE only when modification needed."}]},{"id":"context-types","title":"Context Types","cards":[{"id":"af-6","title":"Application vs Activity Context","concept":"<b>Application Context:</b> Entire app process lifetime. Safe for singletons, DI, WorkManager. Cannot show dialogs or inflate themed views.<br><br><b>Activity Context:</b> Activity lifetime. Has window, theme, UI access. Storing in singleton = MEMORY LEAK.","code":null,"tip":"Rule: Application Context for anything outliving an Activity. Activity Context for anything UI-related."}]},{"id":"launch-modes","title":"Launch Modes","cards":[{"id":"af-7","title":"Launch Modes & Intent Flags","concept":"<b>standard</b> — New instance every time.<br><b>singleTop</b> — Reuse via onNewIntent() if at top. Search results, notifications.<br><b>singleTask</b> — One instance, own task. Dashboard/home.<br><b>singleInstance</b> — Only activity in its task. Payment, dialer.<br><br>Intent flags take precedence over manifest launchMode.","code":null,"tip":"FLAG_ACTIVITY_NEW_TASK + FLAG_ACTIVITY_CLEAR_TOP = singleTask behavior via flags."}]},{"id":"process-death","title":"Process Death","cards":[{"id":"af-8","title":"What Survives Process Death","concept":"<b>Survives:</b> Bundle, SavedStateHandle, persistent storage.<br><b>Lost:</b> ViewModel, static variables, singletons, in-memory caches.<br><br>Test with: <code>adb shell am kill &lt;package&gt;</code> or Android Studio Terminate button.","code":null,"tip":"Common bug: crash after process death because singleton state assumed to persist. Always design for process death."}]},{"id":"manifest","title":"Android Manifest","cards":[{"id":"af-9","title":"exported, allowBackup, configChanges","concept":"<b>exported</b>: API 31+ requires explicit declaration if component has intent-filters.<br><b>allowBackup</b>: Set false for sensitive apps. API 31+ use dataExtractionRules.<br><b>configChanges</b>: Google discourages except for video players/games.","code":null,"tip":"Missing explicit exported on API 31+ causes build error. Most common migration issue when updating targetSdk."}]}]},{"id":"app-architecture","number":2,"title":"App Architecture","sections":[{"id":"three-layer","title":"3-Layer Architecture","cards":[{"id":"aa-1","title":"UI → Domain → Data Layers","concept":"Google's official architecture: <b>UI Layer</b> (Composables, ViewModels) → <b>Domain Layer</b> (UseCases, optional) → <b>Data Layer</b> (Repositories, DataSources).<br><br>Key principles: separation of concerns, drive UI from data models, Single Source of Truth (SSOT), Unidirectional Data Flow (UDF).","code":null,"tip":"Dependency rule: UI → Domain → Data. Data layer should NEVER reference UI layer."}]},{"id":"mvvm","title":"MVVM Pattern","cards":[{"id":"aa-2","title":"MVVM with StateFlow","concept":"<b>Model</b> — Data, Repository, DB. <b>View</b> — passive UI. <b>ViewModel</b> — holds state, processes events.<br><br>UI State = immutable data class. Expose as StateFlow, update with copy().","code":"data class UiState(\n    val articles: List<Article> = emptyList(),\n    val isLoading: Boolean = false,\n    val error: String? = null\n)\n\nclass ArticleVM(private val useCase: GetArticlesUseCase) : ViewModel() {\n    private val _state = MutableStateFlow(UiState())\n    val state: StateFlow<UiState> = _state.asStateFlow()\n    fun load() {\n        viewModelScope.launch {\n            _state.update { it.copy(isLoading = true) }\n            useCase().onSuccess { list ->\n                _state.update { it.copy(articles = list, isLoading = false) }\n            }.onFailure { e ->\n                _state.update { it.copy(error = e.message, isLoading = false) }\n            }\n        }\n    }\n}","tip":"Expose StateFlow (not MutableStateFlow) publicly. Collect with collectAsStateWithLifecycle() in Compose."}]},{"id":"mvi","title":"MVI Pattern","cards":[{"id":"aa-3","title":"MVI: Intents, Reducer, Single State","concept":"View → Intent → Reducer → New State → View.<br><br>Benefits: single immutable state, predictable transitions, time-travel debugging. Trade-off: more boilerplate.<br><br>Use MVI for payments, checkout, complex state machines. MVVM for simple CRUD.","code":"sealed interface CheckoutIntent {\n    data class LoadCart(val userId: String) : CheckoutIntent\n    data object ConfirmPayment : CheckoutIntent\n}\n\ndata class CheckoutState(\n    val items: List<CartItem> = emptyList(),\n    val isProcessing: Boolean = false\n)","tip":"Use MVVM for most screens. Switch to MVI for complex state transitions. Articulate this trade-off in interviews."}]},{"id":"usecases","title":"UseCases","cards":[{"id":"aa-4","title":"UseCase with operator invoke","concept":"UseCases encapsulate single business logic pieces. Named VerbNounUseCase. Use <code>operator fun invoke()</code> for clean call syntax.","code":"class GetArticlesUseCase(\n    private val repo: ArticleRepository\n) {\n    suspend operator fun invoke(filter: ArticleFilter): Result<List<Article>> {\n        return try {\n            val articles = repo.getArticles()\n            Result.success(articles.filter { filter.matches(it) })\n        } catch (e: Exception) { Result.failure(e) }\n    }\n}","tip":"operator invoke() allows calling useCase(filter) instead of useCase.execute(filter)."}]},{"id":"repository","title":"Repository Pattern","cards":[{"id":"aa-5","title":"Offline-First Repository","concept":"Room is SSOT. Network is sync mechanism. UI observes Room via Flow. Repository checks staleness, fetches from API, upserts into Room. Flow auto-emits.","code":"class RepoImpl(val dao: ArticleDao, val api: ArticleApi) : Repo {\n    override fun observe(): Flow<List<Article>> =\n        dao.observeAll().map { it.map { e -> e.toDomain() } }\n    override suspend fun refresh() {\n        val remote = api.getArticles()\n        dao.upsertAll(remote.map { it.toEntity() })\n    }\n}","tip":"Google strongly favors offline-first. Room SSOT is the pattern to know for every architecture question."}]},{"id":"viewmodel-deep","title":"ViewModel Deep Dive","cards":[{"id":"aa-6","title":"ViewModel Survival & Sharing","concept":"ViewModel survives config change via ViewModelStore + NonConfigurationInstance. Share via activityViewModels() or navGraphViewModels(). Does NOT survive process death.","code":"class StepOneFragment : Fragment() {\n    private val vm: CheckoutVM by navGraphViewModels(R.id.checkout_graph)\n}","tip":"navGraphViewModels() is ideal for multi-screen flows (checkout, onboarding)."}]},{"id":"navigation","title":"Navigation Component","cards":[{"id":"aa-7","title":"Compose Navigation & Type-Safe Routes","concept":"NavHost + NavController + route strings. Type-safe routes (Nav 2.8+) use @Serializable data classes. Key: rememberNavController(), launchSingleTop, popUpTo for auth flows.","code":"@Serializable data class ArticleRoute(val articleId: String)\n\nNavHost(navController, startDestination = HomeRoute) {\n    composable<ArticleRoute> { entry ->\n        val route = entry.toRoute<ArticleRoute>()\n        ArticleDetailScreen(route.articleId)\n    }\n}","tip":"Don't pass complex objects as arguments — pass IDs and fetch from ViewModel/repository."}]},{"id":"multi-source","title":"Multi-Source Data Merging","cards":[{"id":"aa-8","title":"combine + debounce + flatMapLatest","concept":"combine() merges N flows. debounce(300) avoids keystroke hammering. flatMapLatest cancels stale queries. stateIn(WhileSubscribed(5000)) manages lifecycle.","code":"val uiState = combine(query.debounce(300), filterFlow, sortFlow)\n    { q, f, s -> Triple(q, f, s) }\n    .flatMapLatest { (q, f, s) ->\n        repo.search(q, f).map { SearchState(results = it) }\n    }.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), SearchState())","tip":"This pattern answers 'How would you build a search screen with filters and offline support?'"}]}]},{"id":"jetpack-compose","number":3,"title":"Jetpack Compose","sections":[{"id":"declarative","title":"Declarative UI","cards":[{"id":"jc-1","title":"Declarative vs Imperative","concept":"Imperative: MUTATE existing views. Declarative (Compose): DESCRIBE what UI should look like for given state. Framework diffs and applies changes.","code":"// Imperative\ntextView.text = \"Hello\"\n// Declarative\n@Composable\nfun Greeting(name: String) { Text(\"Hello, $name\") }","tip":null}]},{"id":"recomposition","title":"Recomposition","cards":[{"id":"jc-2","title":"Smart Recomposition & Skipping","concept":"Compose re-executes ONLY composables reading changed state. Skipped if parameters stable and unchanged. Positional memoization identifies by POSITION in call tree.","code":"@Composable\nfun Demo() {\n    var count by remember { mutableStateOf(0) }\n    Column {\n        Text(\"Count: $count\")  // Recomposes\n        Text(\"Static\")         // Does NOT recompose\n        Button(onClick = { count++ }) { Text(\"Inc\") }\n    }\n}","tip":"Recomposition can happen in ANY ORDER and CONCURRENTLY. Never perform side effects in composable body."}]},{"id":"state","title":"State Management","cards":[{"id":"jc-3","title":"remember vs rememberSaveable vs derivedStateOf","concept":"<b>remember</b> — survives recomposition, lost on config change.<br><b>rememberSaveable</b> — survives config change + process death. Bundle-compatible types only.<br><b>derivedStateOf</b> — recomposes only when result changes.<br><b>collectAsStateWithLifecycle()</b> — always use over collectAsState().","code":"var input by rememberSaveable { mutableStateOf(\"\") }\nval hasItems by remember { derivedStateOf { items.isNotEmpty() } }\nval state by viewModel.uiState.collectAsStateWithLifecycle()","tip":"collectAsState keeps collecting in background. Always use collectAsStateWithLifecycle for ViewModel StateFlows."}]},{"id":"hoisting","title":"State Hoisting","cards":[{"id":"jc-4","title":"Stateless Composables","concept":"Move state UP to caller. Composable receives state + event callbacks as parameters. Benefits: reusable, testable, previewable.","code":"@Composable\nfun SearchBar(query: String, onChange: (String) -> Unit) {\n    TextField(value = query, onValueChange = onChange)\n}","tip":"Hoist state to the lowest common ancestor that needs it."}]},{"id":"side-effects","title":"Side Effects","cards":[{"id":"jc-5","title":"LaunchedEffect, DisposableEffect, SideEffect","concept":"<b>LaunchedEffect(key)</b> — suspend function, restarts on key change.<br><b>DisposableEffect</b> — register/unregister with onDispose.<br><b>SideEffect</b> — every recomposition, synchronous.<br><b>rememberCoroutineScope</b> — for onClick callbacks.<br><b>rememberUpdatedState</b> — capture latest value in long-running effects.","code":"LaunchedEffect(userId) { repo.fetchUser(userId) }\n\nDisposableEffect(lifecycle) {\n    val obs = LifecycleEventObserver { _, e -> /* ... */ }\n    lifecycle.addObserver(obs)\n    onDispose { lifecycle.removeObserver(obs) }\n}","tip":"NEVER perform side effects directly in composable body. LaunchedEffect(Unit) captures INITIAL value of params — use rememberUpdatedState."}]},{"id":"phases","title":"Compose Phases","cards":[{"id":"jc-6","title":"Composition → Layout → Drawing","concept":"Defer state reads to latest phase. Composition triggers recomposition. Layout triggers re-layout only. Drawing triggers re-draw only.","code":"// Bad: reads in Composition\nBox(Modifier.offset(x = offset.dp))\n// Good: reads in Layout\nBox(Modifier.offset { IntOffset(offset.toInt(), 0) })\n// Best: reads in Drawing\nBox(Modifier.drawBehind { drawCircle(Color.Red, center = Offset(offset, 0f)) })","tip":"For animations, always use lambda variants to defer state reads."}]},{"id":"stability","title":"Stability & Performance","cards":[{"id":"jc-7","title":"@Stable, @Immutable, ImmutableList","concept":"Stable types enable skip optimization. List/Set/Map are unstable (could be mutable). Fix: ImmutableList, @Immutable annotation. Lambda stability: use remember or method references.","code":"@Immutable\ndata class ArticleUi(val id: String, val title: String, val tags: ImmutableList<String>)\n\n// Stable lambda\nval onClick = remember(article.id) { { viewModel.onClick(article.id) } }","tip":"Lambda capturing unstable var = new instance each recomposition. Stable lambdas enable child composable skipping."}]},{"id":"interop","title":"Compose Interop","cards":[{"id":"jc-8","title":"AndroidView & ComposeView","concept":"<b>AndroidView</b> — embed View in Compose. Factory once, update on recomposition.<br><b>ComposeView</b> — embed Compose in Fragment. Use DisposeOnViewTreeLifecycleDestroyed.<br><br>Migration strategy: bottom-up, replace leaf components first.","code":"ComposeView(requireContext()).apply {\n    setViewCompositionStrategy(\n        ViewCompositionStrategy.DisposeOnViewTreeLifecycleDestroyed\n    )\n    setContent { AppTheme { ProfileScreen() } }\n}","tip":"ComposeView doesn't inherit Material theme from XML — must wrap in Compose theme."}]},{"id":"compiler","title":"Compose Compiler","cards":[{"id":"jc-9","title":"Compiler Transforms","concept":"Compiler adds Composer parameter, generates slot table groups, adds $changed bitmask for skip checks, transforms remember to slot table operations, creates restartable groups. Snapshot system tracks state reads/writes.","code":null,"tip":"Understanding compiler internals explains WHY stability matters and WHY @Composable can only call other @Composable."}]}]},{"id":"coroutines-flows","number":4,"title":"Coroutines & Flows","sections":[{"id":"fundamentals","title":"Fundamentals","cards":[{"id":"cf-1","title":"Suspend Functions","concept":"Coroutine = lightweight thread that suspends without blocking. Compiler transforms suspend functions into state machines (CPS). A suspended coroutine does NOT occupy a thread.","code":"suspend fun fetchProfile(userId: String): Profile {\n    val user = userApi.getUser(userId)   // Suspension point\n    val posts = postApi.getPosts(userId) // Suspension point\n    return Profile(user, posts)\n}","tip":"Thread: OS-level, ~1MB, blocks. Coroutine: library-level, ~bytes, suspends. 'Suspending frees the thread; blocking holds it hostage.'"}]},{"id":"dispatchers","title":"Dispatchers","cards":[{"id":"cf-2","title":"Main, IO, Default","concept":"<b>Main</b> — UI thread. <b>IO</b> — 64 threads, disk/network/DB. <b>Default</b> — CPU cores, JSON/sorting. <b>Main.immediate</b> — executes immediately if already on main. Inject dispatchers for testability.","code":"class Repo(private val dispatchers: DispatcherProvider) {\n    suspend fun getUser(id: String) = withContext(dispatchers.io) {\n        api.fetchUser(id)\n    }\n}","tip":"Always explain your Dispatcher choice. IO for blocking I/O, Default for CPU work, Main for UI."}]},{"id":"structured","title":"Structured Concurrency","cards":[{"id":"cf-3","title":"4 Guarantees","concept":"1. Parent waits for children. 2. Cancel parent → cancel children. 3. Child failure → cancel parent+siblings (unless SupervisorJob). 4. Coroutines only in CoroutineScope. GlobalScope breaks all of this.","code":"viewModelScope.launch { // Cancelled when ViewModel cleared\n    val user = async { fetchUser() }\n    val posts = async { fetchPosts() }\n    updateUI(user.await(), posts.await())\n}","tip":"Never use GlobalScope. For app-wide work, inject custom CoroutineScope with SupervisorJob."}]},{"id":"launch-async","title":"launch vs async","cards":[{"id":"cf-4","title":"Fire-and-Forget vs Parallel","concept":"<b>launch</b> — no result (Job). <b>async</b> — result via await() (Deferred). supervisorScope for partial failure tolerance.","code":"// Parallel — max(500,300,400) = 500ms\nsuspend fun loadParallel() = coroutineScope {\n    val user = async { fetchUser() }     // 500ms\n    val posts = async { fetchPosts() }   // 300ms\n    ProfileData(user.await(), posts.await())\n}","tip":"async without await silently swallows exceptions. Use supervisorScope when some failures are acceptable."}]},{"id":"exceptions","title":"Exception Handling","cards":[{"id":"cf-5","title":"try-catch, Result Wrapper","concept":"launch propagates UP. async defers to await(). Best: Result wrapper in repository. Never catch CancellationException without rethrowing.","code":"suspend fun fetchData(): Result<Data> = try {\n    Result.success(api.getData())\n} catch (e: Exception) {\n    Result.failure(e)\n}","tip":"Use specific exception types (IOException, HttpException) instead of broad Exception catch."}]},{"id":"cancellation","title":"Cancellation","cards":[{"id":"cf-6","title":"Cooperative Cancellation","concept":"Cancellation is cooperative — must CHECK at suspension points. CPU loops need ensureActive() or yield(). NonCancellable for critical cleanup.","code":"suspend fun cpuWork() = withContext(Dispatchers.Default) {\n    while (i < 1_000_000) {\n        i++\n        if (i % 1000 == 0) ensureActive()\n    }\n}\n\ntry { work() }\nfinally { withContext(NonCancellable) { cleanup() } }","tip":"ensureActive() throws CancellationException if cancelled. Essential for CPU-bound loops."}]},{"id":"flow","title":"Flow & StateFlow","cards":[{"id":"cf-7","title":"Cold Flow, StateFlow, SharedFlow, Channel","concept":"<b>Flow</b> — cold, each collector gets independent execution. Room uses this.<br><b>StateFlow</b> — hot, always has value, conflated. UI state.<br><b>SharedFlow</b> — hot, configurable replay. Events.<br><b>Channel</b> — exactly-once delivery. Navigation events.","code":"// StateFlow for state\nprivate val _state = MutableStateFlow(UiState())\nval state: StateFlow<UiState> = _state.asStateFlow()\n\n// Channel for events\nprivate val _events = Channel<NavEvent>(Channel.BUFFERED)\nval events = _events.receiveAsFlow()","tip":"Never use StateFlow for events (re-delivered on config change). Channel guarantees exactly-once delivery."}]},{"id":"operators","title":"Flow Operators","cards":[{"id":"cf-8","title":"debounce, flatMapLatest, combine, stateIn","concept":"<b>debounce(300)</b> — wait for typing pause. <b>flatMapLatest</b> — cancel previous query. <b>combine</b> — merge N flows. <b>stateIn(WhileSubscribed(5000))</b> — recommended default.","code":"searchQuery.debounce(300)\n    .filter { it.length >= 2 }\n    .distinctUntilChanged()\n    .flatMapLatest { repo.search(it) }\n    .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())","tip":"WhileSubscribed(5000) survives config changes within 5s, stops when truly gone."}]},{"id":"android","title":"Coroutines in Android","cards":[{"id":"cf-9","title":"viewModelScope, repeatOnLifecycle","concept":"viewModelScope — Main.immediate, cancelled in onCleared(). repeatOnLifecycle(STARTED) — restarts in onStart, cancels in onStop. Always use for Fragment Flow collection.","code":"viewLifecycleOwner.lifecycleScope.launch {\n    viewLifecycleOwner.repeatOnLifecycle(Lifecycle.State.STARTED) {\n        launch { viewModel.state.collect { updateUI(it) } }\n        launch { viewModel.events.collect { handleEvent(it) } }\n    }\n}","tip":"In Compose, collectAsStateWithLifecycle does this automatically."}]},{"id":"callbackflow","title":"callbackFlow","cards":[{"id":"cf-10","title":"Bridging Callbacks","concept":"callbackFlow bridges callback APIs to Flow. MUST call awaitClose for cleanup. Use trySend (non-suspending) in callbacks.","code":"fun locationUpdates(): Flow<Location> = callbackFlow {\n    val cb = object : LocationCallback() {\n        override fun onLocationResult(r: LocationResult) { trySend(r.lastLocation) }\n    }\n    requestLocationUpdates(req, cb, Looper.getMainLooper())\n    awaitClose { removeLocationUpdates(cb) }\n}","tip":"callbackFlow without awaitClose completes immediately. Always clean up in awaitClose."}]}]},{"id":"data-persistence","number":5,"title":"Data Persistence","sections":[{"id":"room","title":"Room Database","cards":[{"id":"dp-1","title":"Entity, DAO, Database","concept":"Room = SQLite abstraction with compile-time verification. @Entity (table), @Dao (operations), @Database (ties together). @Upsert for insert-or-update. @Transaction for atomic operations.","code":"@Entity(tableName = \"articles\")\ndata class ArticleEntity(\n    @PrimaryKey val id: String,\n    val title: String,\n    val authorId: String\n)\n\n@Dao\ninterface ArticleDao {\n    @Query(\"SELECT * FROM articles\")\n    fun observeAll(): Flow<List<ArticleEntity>>\n    @Upsert\n    suspend fun upsertAll(articles: List<ArticleEntity>)\n}","tip":"Room is the SSOT backbone. Know Entity indices, DAO suspend vs Flow, @Transaction."}]},{"id":"relations","title":"Room Relations","cards":[{"id":"dp-2","title":"One-to-Many, Many-to-Many","concept":"@Relation with parentColumn + entityColumn for One-to-Many. @Junction for Many-to-Many. Always use @Transaction for @Relation queries.","code":"data class UserWithArticles(\n    @Embedded val user: UserEntity,\n    @Relation(parentColumn = \"id\", entityColumn = \"author_id\")\n    val articles: List<ArticleEntity>\n)\n\n@Dao\ninterface UserDao {\n    @Transaction\n    @Query(\"SELECT * FROM users WHERE id = :userId\")\n    suspend fun getUserWithArticles(userId: String): UserWithArticles\n}","tip":"@Transaction ensures parent and child queries run atomically."}]},{"id":"migrations","title":"Room Migrations","cards":[{"id":"dp-3","title":"Auto vs Manual Migration","concept":"AutoMigration (Room 2.4+) for simple changes. Manual Migration for complex schema changes. Always test with MigrationTestHelper.","code":"@Database(entities = [ArticleEntity::class], version = 3,\n    autoMigrations = [AutoMigration(from = 1, to = 2)])\nabstract class AppDatabase : RoomDatabase()","tip":"A bad migration corrupts user data. ALWAYS test migrations."}]},{"id":"datastore","title":"DataStore","cards":[{"id":"dp-4","title":"Preferences DataStore","concept":"Modern replacement for SharedPreferences. Async (Flow API), error handling via catch, transactional, type-safe keys.","code":"val prefs: Flow<UserPrefs> = dataStore.data\n    .catch { if (it is IOException) emit(emptyPreferences()) else throw it }\n    .map { UserPrefs(darkMode = it[DARK_MODE_KEY] ?: false) }\n\nsuspend fun setDarkMode(on: Boolean) {\n    dataStore.edit { it[DARK_MODE_KEY] = on }\n}","tip":"SharedPreferences apply() blocks main thread on Activity stop (ANR risk). DataStore is always async."}]},{"id":"paging","title":"Paging 3 + Room","cards":[{"id":"dp-5","title":"RemoteMediator Pattern","concept":"Network → RemoteMediator → Room (SSOT) → PagingSource → UI. cachedIn(viewModelScope) survives config changes. Room PagingSource auto-invalidates.","code":"val pager = Pager(\n    config = PagingConfig(pageSize = 20),\n    remoteMediator = ArticleRemoteMediator(api, db),\n    pagingSourceFactory = { db.articleDao().pagingSource() }\n).flow.cachedIn(viewModelScope)","tip":"Google-recommended pattern for offline-first paginated lists. Know the full flow end-to-end."}]}]},{"id":"networking","number":6,"title":"Networking","sections":[{"id":"retrofit","title":"Retrofit & OkHttp","cards":[{"id":"net-1","title":"Retrofit + OkHttp + Interceptors","concept":"Retrofit = type-safe HTTP client. OkHttp handles actual HTTP. Application interceptors: called once, auth/logging. Network interceptors: called per request, cache control. Auth interceptor: add token → 401 → refresh → retry.","code":"class AuthInterceptor(val tokenProvider: TokenProvider) : Interceptor {\n    override fun intercept(chain: Interceptor.Chain): Response {\n        val req = chain.request().newBuilder()\n            .addHeader(\"Authorization\", \"Bearer ${tokenProvider.getToken()}\")\n            .build()\n        val res = chain.proceed(req)\n        if (res.code == 401) {\n            res.close()\n            val newToken = tokenProvider.refreshToken()\n            return chain.proceed(req.newBuilder()\n                .header(\"Authorization\", \"Bearer $newToken\").build())\n        }\n        return res\n    }\n}","tip":"Use Kotlin Serialization for new projects (compile-time, no reflection). Configure ignoreUnknownKeys = true."}]},{"id":"network-arch","title":"Network Architecture","cards":[{"id":"net-2","title":"NetworkResult & safeApiCall","concept":"Sealed class wrapping Success, Error (HTTP), Exception (network). safeApiCall wrapper handles all outcomes cleanly.","code":"sealed interface NetworkResult<out T> {\n    data class Success<T>(val data: T) : NetworkResult<T>\n    data class Error(val code: Int, val msg: String) : NetworkResult<Nothing>\n    data class Exception(val t: Throwable) : NetworkResult<Nothing>\n}","tip":"Separate network errors from HTTP errors from parsing errors for precise UI error handling."}]},{"id":"connectivity","title":"Connectivity & Real-time","cards":[{"id":"net-3","title":"NetworkCallback + WebSocket vs SSE","concept":"callbackFlow + NetworkCallback for connectivity monitoring. WebSocket for bidirectional (chat). SSE for server-push (feeds). Polling for simple low-frequency.<br><br>Cursor pagination over offset pagination. Idempotency keys for POST safety.","code":null,"tip":"Mention cursor-based pagination and gRPC in Google interviews. Google uses gRPC extensively for internal services."}]}]},{"id":"android-internals","number":7,"title":"Android Internals","sections":[{"id":"process","title":"Process & Memory","cards":[{"id":"ai-1","title":"Process Model & LMK","concept":"Each app = own Linux process + ART VM. LMK kills by priority: Foreground → Visible → Service → Cached → Empty.<br><br>Binder IPC: ~1MB transaction limit. Used by startActivity, bindService, ContentResolver.","code":null,"tip":"The 1MB Binder limit affects Intent extras and onSaveInstanceState Bundles."},{"id":"ai-2","title":"Handler/Looper & Dispatchers.Main","concept":"Looper = message loop. MessageQueue = FIFO queue. Handler = sends to Looper. Main Thread has a Looper. Dispatchers.Main posts to main Looper's Handler.","code":null,"tip":"Dispatchers.Main.immediate executes immediately if already on main thread, avoiding one frame delay."}]},{"id":"startup","title":"App Startup & ART","cards":[{"id":"ai-3","title":"Cold/Warm/Hot Start & Zygote","concept":"Cold: Zygote fork → Application.onCreate() → Activity → first frame. Warm: process exists. Hot: process + Activity exist.<br><br>Zygote pre-loads framework. fork() is fast (copy-on-write). Google target: cold start < 500ms.","code":null,"tip":"Baseline Profiles AOT-compile critical paths at install time. 20-30% startup improvement typical."},{"id":"ai-4","title":"ANR Triggers & Diagnosis","concept":"Triggers: input > 5s, BroadcastReceiver > 10s, Service > 20s. Diagnosis: traces.txt, StrictMode, Perfetto, Play Console.<br><br>Play thresholds: > 0.47% ANR rate = warning, > 8% = deprioritized.","code":null,"tip":"Discuss StrictMode for detection, Dispatchers.IO for I/O, Play Console vitals for monitoring."}]},{"id":"memory","title":"Memory Management","cards":[{"id":"ai-5","title":"Heap Structure & onTrimMemory","concept":"ART Heap: Young Gen (minor GC), Old Gen (major GC), Large Object Space (> 12KB).<br><br>onTrimMemory levels 5→80. Respond by progressively releasing caches. largeHeap is usually an anti-pattern.","code":null,"tip":"Use LruCache.trimToSize() progressively. Clear image caches at UI_HIDDEN, release everything at COMPLETE."}]}]},{"id":"performance","number":8,"title":"Performance Optimization","sections":[{"id":"ui","title":"UI & Compose Performance","cards":[{"id":"perf-1","title":"Jank, Overdraw, RecyclerView, Compose","concept":"Frame budget: 16.6ms (60fps). DiffUtil for RecyclerView (never notifyDataSetChanged). key() for LazyColumn. derivedStateOf, defer state reads, ImmutableList, stable lambdas for Compose.","code":"class DiffCallback : DiffUtil.ItemCallback<Article>() {\n    override fun areItemsTheSame(o: Article, n: Article) = o.id == n.id\n    override fun areContentsTheSame(o: Article, n: Article) = o == n\n}","tip":"DiffUtil payloads enable partial rebinds. Check recomposition counts with Layout Inspector."}]},{"id":"memory","title":"Memory & Startup","cards":[{"id":"perf-2","title":"Leaks, Bitmaps, Baseline Profiles","concept":"Common leaks: static Activity ref, inner class, unregistered listeners, Fragment binding. Bitmap: 4000x3000 ARGB_8888 = 48MB! Use inSampleSize.<br><br>Baseline Profiles: 20-30% startup improvement. R8: shrinking + obfuscation.","code":null,"tip":"Baseline Profiles are Google-created. Mentioning BaselineProfileRule and CI integration is a strong SDE-2 signal."}]},{"id":"vitals","title":"Android Vitals","cards":[{"id":"perf-3","title":"Thresholds & Profiling","concept":"ANR > 0.47% = bad. Crash > 1.09% = bad. Frozen frames > 0.1% = bad.<br><br>Perfetto for system-level tracing. LeakCanary for leak detection. Macrobenchmark for startup/scroll measurement.","code":null,"tip":"Apps with bad vitals get warning badge, lower search ranking, reduced recommendations."}]}]},{"id":"background-work","number":9,"title":"Background Work","sections":[{"id":"decision","title":"Decision Framework","cards":[{"id":"bg-1","title":"Which API to Use","concept":"<b>Must complete:</b> WorkManager. <b>Immediate:</b> Coroutines. <b>Long task:</b> FGS. <b>Exact time:</b> AlarmManager. <b>System events:</b> BroadcastReceiver. <b>Default:</b> WorkManager.","code":null,"tip":"Always mention background execution restrictions (API 26+, Doze, Standby Buckets)."}]},{"id":"workmanager","title":"WorkManager","cards":[{"id":"bg-2","title":"CoroutineWorker, Constraints, Expedited","concept":"Survives reboot. Constraint-based. Chaining. Exponential backoff. Unique work. Expedited for urgent short-lived tasks.","code":"class SyncWorker(ctx: Context, params: WorkerParameters)\n    : CoroutineWorker(ctx, params) {\n    override suspend fun doWork(): Result {\n        return try {\n            repo.sync()\n            Result.success()\n        } catch (e: IOException) {\n            if (runAttemptCount < 3) Result.retry() else Result.failure()\n        }\n    }\n}","tip":"KEEP for ExistingWorkPolicy prevents duplicates. setExpedited() for urgent work on API 31+."}]},{"id":"fgs-fcm","title":"FGS & FCM","cards":[{"id":"bg-3","title":"FGS Restrictions & FCM Messages","concept":"API 31+: can't start FGS from background (use WorkManager expedited). API 34+: must declare FGS type.<br><br>FCM: data messages always hit onMessageReceived. Notification messages auto-display in background. Always use data-only for control.","code":null,"tip":"HIGH priority FCM gives ~10s window to start FGS on API 31+. Always have WorkManager fallback."}]}]},{"id":"dependency-injection","number":10,"title":"Dependency Injection","sections":[{"id":"hilt","title":"Hilt","cards":[{"id":"di-1","title":"Hilt Setup, Scoping, Qualifiers","concept":"@HiltAndroidApp, @AndroidEntryPoint, @HiltViewModel. Component hierarchy: Singleton → ActivityRetained → ViewModel → Activity → Fragment. @Singleton, @ViewModelScoped, no scope = new instance. @Provides for 3rd party, @Binds for interfaces.","code":"@Module @InstallIn(SingletonComponent::class)\nobject NetworkModule {\n    @Provides @Singleton\n    fun provideRetrofit(): Retrofit = Retrofit.Builder().build()\n}\n\n@HiltViewModel\nclass VM @Inject constructor(\n    private val useCase: GetArticlesUseCase,\n    private val ssh: SavedStateHandle\n) : ViewModel()","tip":"@Binds is more efficient than @Provides (less generated code). Use for interface→implementation mapping."},{"id":"di-2","title":"@HiltWorker & @EntryPoint","concept":"@HiltWorker needs custom WorkManager init: disable default initializer, implement Configuration.Provider, inject HiltWorkerFactory. @EntryPoint for ContentProvider (created before Hilt ready).","code":"@HiltWorker\nclass SyncWorker @AssistedInject constructor(\n    @Assisted ctx: Context,\n    @Assisted params: WorkerParameters,\n    private val repo: ArticleRepository\n) : CoroutineWorker(ctx, params)","tip":"Three pieces for @HiltWorker: disable default initializer, Configuration.Provider, @AssistedInject."}]}]},{"id":"testing","number":11,"title":"Testing","sections":[{"id":"strategy","title":"Testing Strategy","cards":[{"id":"test-1","title":"Pyramid, Fakes, MainDispatcherRule","concept":"70% unit / 20% integration / 10% E2E. Google prefers FAKES over MOCKS (more resilient to refactoring). MainDispatcherRule for ViewModel tests. Turbine for Flow assertions. MockWebServer for HTTP stack.","code":"class VMTest {\n    @get:Rule val rule = MainDispatcherRule()\n    private val fakeRepo = FakeArticleRepository()\n\n    @Test fun `load success`() = runTest {\n        fakeRepo.setArticles(listOf(Article(\"1\")))\n        val vm = ArticleVM(GetArticlesUseCase(fakeRepo))\n        vm.load(); advanceUntilIdle()\n        assertEquals(1, vm.state.value.articles.size)\n    }\n}","tip":"Fakes for data-providing deps (repos, APIs). Mocks for verifying interactions (analytics, logging)."},{"id":"test-2","title":"Compose Testing & Room Testing","concept":"ComposeTestRule with semantic matchers (onNodeWithText, onNodeWithTag). Room: in-memory DB on real device. MockWebServer: local HTTP server, catches serialization bugs.","code":"@get:Rule val composeRule = createComposeRule()\n@Test fun `shows articles`() {\n    composeRule.setContent {\n        ArticleList(uiState = UiState(articles = listOf(Article(\"1\", \"Kotlin\"))))\n    }\n    composeRule.onNodeWithText(\"Kotlin\").assertIsDisplayed()\n}","tip":"Test stateless composables directly with test state — faster and more reliable than testing through ViewModel."}]}]},{"id":"security","number":12,"title":"Security","sections":[{"id":"security","title":"Security","cards":[{"id":"sec-1","title":"Permissions, Pinning, Keystore","concept":"Activity Result API for permissions. Network Security Config for cert pinning (XML recommended, always backup pin). Android Keystore: hardware-backed, keys never leave TEE. EncryptedSharedPreferences for tokens.","code":"val masterKey = MasterKey.Builder(context)\n    .setKeyScheme(MasterKey.KeyScheme.AES256_GCM).build()\nval prefs = EncryptedSharedPreferences.create(\n    context, \"secure\", masterKey,\n    PrefKeyEncryptionScheme.AES256_SIV,\n    PrefValueEncryptionScheme.AES256_GCM\n)","tip":"Never store tokens in plain SharedPreferences. Keystore keys can't be extracted even with root access."},{"id":"sec-2","title":"Common Vulnerabilities","concept":"Insecure storage → EncryptedSharedPreferences. MITM → cert pinning. SQL injection → Room parameterized queries. Intent spoofing → exported=false. WebView → disable file access, validate URLs. Reverse engineering → R8 + Play Integrity.","code":null,"tip":"R8 mapping.txt maps obfuscated names to originals. Upload to Play Console for auto-deobfuscated crash reports."},{"id":"sec-3","title":"Certificate Pinning Deep Dive","concept":"Pin <b>SPKI public key hash</b>, not full cert. Always ship <b>current + backup</b> pin. Set XML expiration. Remote-config kill switch for emergencies.<br><br>Without backup pin, cert rotation <b>bricks the app</b> for all users.","code":null,"tip":"Pinning = transport security (MITM). Play Integrity = runtime/device verification. Use both for layered defense."},{"id":"sec-4","title":"Play Integrity API","concept":"App requests signed token → send to <b>your backend</b> → Google API decodes verdict. Never trust client-side.<br><br>Check: deviceIntegrity, appIntegrity (PLAY_RECOGNIZED), requestPackageName.<br><br>Replaces deprecated SafetyNet Attestation.","code":null,"tip":"Graceful degradation when Play Store unavailable — don't hard-crash. Test failure paths in debug builds."}]}]},{"id":"modern-android","number":13,"title":"Modern Android","sections":[{"id":"modern","title":"Modern Android Dev","cards":[{"id":"ma-1","title":"KMP & Modularization","concept":"KMP: share business logic across platforms. expect/actual for platform APIs. Google making Jetpack KMP-compatible.<br><br>Modularization: :app → :feature → :core. Features don't know about each other. Navigate via routes/URIs.","code":null,"tip":"Module dependency rule: features depend on core, not other features."},{"id":"ma-2","title":"Predictive Back & Adaptive Layouts","concept":"OnBackPressedCallback replaces onBackPressed(). Enforced API 36. WindowSizeClass (Compact/Medium/Expanded) for layout strategy. NavigationSuiteScaffold auto-switches nav component.","code":"@Composable\nfun Adaptive(wsc: WindowSizeClass) {\n    when (wsc.widthSizeClass) {\n        Compact -> ListScreen()\n        else -> Row { ListScreen(Modifier.weight(.4f)); DetailScreen(Modifier.weight(.6f)) }\n    }\n}","tip":"Google evaluates apps on large screens for Play Store featuring."},{"id":"ma-3","title":"Credential Manager & Photo Picker","concept":"Credential Manager: passkeys + passwords + federated sign-in. Replaces SmartLock/OneTap.<br><br>Photo Picker: no permissions needed. System UI. Privacy-preserving.","code":"val pickMedia = registerForActivityResult(PickVisualMedia()) { uri ->\n    if (uri != null) loadImage(uri)\n}\npickMedia.launch(PickVisualMediaRequest(PickVisualMedia.ImageOnly))","tip":"Passkeys are Google's strategic authentication direction. Photo Picker is the default for image selection."}]}]},{"id":"design-patterns-kotlin","number":14,"title":"Design Patterns & Kotlin","sections":[{"id":"kotlin","title":"Kotlin Advanced","cards":[{"id":"dk-1","title":"Sealed Classes, Delegates, Extensions","concept":"Sealed: restricted hierarchy, exhaustive when. by lazy: thread-safe deferred init. Extension functions: resolved statically, member wins on conflict.","code":"sealed interface UiState<out T> {\n    data object Loading : UiState<Nothing>\n    data class Success<T>(val data: T) : UiState<T>\n    data class Error(val msg: String) : UiState<Nothing>\n}\n\nval db by lazy { Room.databaseBuilder(...).build() }","tip":"Prefer sealed interface for ADTs. by lazy reduces cold start time."},{"id":"dk-2","title":"Generics (in/out), Value Classes, Scope Functions","concept":"<b>out</b> = produce (covariant). <b>in</b> = consume (contravariant). Value classes: zero-cost type safety for IDs. Scope functions: apply (configure), let (null-safe), also (side effects).","code":"@JvmInline value class UserId(val value: String)\n@JvmInline value class ArticleId(val value: String)\n\nval intent = Intent(ctx, DetailActivity::class.java).apply {\n    putExtra(\"ID\", id)\n}","tip":"Value classes prevent passing wrong ID type with zero runtime cost."},{"id":"dk-3","title":"Design Patterns in Android","concept":"Observer (StateFlow, Compose state). Factory (ViewModelProvider.Factory). Builder (OkHttpClient.Builder — in Kotlin use default params). Repository (SSOT). Decorator (OkHttp Interceptors, Compose Modifiers).","code":null,"tip":"Extension functions replace Decorator. object keyword replaces Singleton. Default parameters replace Builder."}]}]},{"id":"system-design","number":15,"title":"System Design","sections":[{"id":"framework","title":"Framework & Designs","cards":[{"id":"sd-1","title":"6-Step System Design Framework","concept":"1. Requirements (functional + non-functional). 2. Scale estimation. 3. High-level architecture. 4. Component walkthrough. 5. Failure modes. 6. Trade-offs.<br><br>Mobile constraints: network, battery, memory, process death, security, lifecycle, fragmentation.","code":null,"tip":"Always discuss mobile-specific constraints proactively."},{"id":"sd-2","title":"Offline-First Notes App","concept":"Room SSOT + Sync Engine (WorkManager). Sync metadata: syncStatus, serverVersion, localVersion, isDeleted (soft delete). Conflict: LWW (simple), 3-way merge (text), user resolution (complex).","code":null,"tip":"Discuss trade-offs of each conflict strategy. Cost of data loss vs implementation complexity."},{"id":"sd-3","title":"Chat App Design","concept":"WebSocket + FCM + Room. Send: Room(PENDING) → WebSocket → ACK(SENT) → DELIVERED → READ. Offline queue. Exponential backoff reconnection. Paging 3 for history. E2E encryption with Signal Protocol.","code":null,"tip":"Key points: message ordering (server timestamps + local sequence), offline queue, E2E encryption, pagination."},{"id":"sd-4","title":"Analytics SDK & Image Loader","concept":"Analytics: Event → Channel queue → Batch → Persist → WorkManager upload. Sampling for volume control.<br><br>Image Loader: Memory LRU → Disk cache → Network → Decode with inSampleSize. Request deduplication. Lifecycle cancellation.","code":null,"tip":"Discuss ring buffer for logging SDK, crash handler with immediate flush, privacy (never log PII)."}]}]},{"id":"interview-questions","number":16,"title":"Interview Questions","sections":[{"id":"tier1","title":"Tier 1: Most Frequent","cards":[{"id":"iq-1","title":"Activity A→B Lifecycle","concept":"A.onPause() → B.onCreate() → B.onStart() → B.onResume() → A.onStop(). If B transparent: A only onPause. Back: B.onPause() → A.onRestart() → A.onStart() → A.onResume() → B.onStop() → B.onDestroy().","code":null,"tip":"Know config change on B (only B affected), and process death handling."},{"id":"iq-2","title":"StateFlow vs SharedFlow vs Channel","concept":"StateFlow: required initial value, conflated, UI state. SharedFlow: configurable replay, events. Channel: exactly-once delivery, navigation events. Channel buffers during config change; SharedFlow(replay=0) loses events.","code":null,"tip":"Channel is safest for one-time events (toast, navigate)."},{"id":"iq-3","title":"Compose Recomposition Optimization","concept":"derivedStateOf, defer state reads to Layout/Drawing, ImmutableList, key() for LazyColumn, collectAsStateWithLifecycle, stable lambdas via remember.","code":null,"tip":"Three phases: Composition → Layout → Drawing. Read state in latest possible phase."},{"id":"iq-4","title":"Structured Concurrency","concept":"4 guarantees. coroutineScope: one fails → all fail. supervisorScope: siblings survive. Never GlobalScope.","code":null,"tip":"supervisorScope for partial failure tolerance."},{"id":"iq-5","title":"Offline-First Architecture","concept":"Room = SSOT. UI reads Room Flow. Repository fetches API → upserts Room → Flow auto-emits. Writes: Room immediately, sync via WorkManager.","code":null,"tip":"THE pattern for Google architecture interviews."},{"id":"iq-6","title":"Hilt Scoping","concept":"Singleton → ActivityRetained → ViewModel → Activity → Fragment. @Provides for 3rd party, @Binds for interfaces (more efficient).","code":null,"tip":"Know @Provides vs @Binds difference."}]},{"id":"tier2","title":"Tier 2 & Rapid Fire","cards":[{"id":"iq-7","title":"ViewModel Survival & One-Time Events","concept":"ViewModelStore + NonConfigurationInstance. Share: activityViewModels(), navGraphViewModels(). Events: Channel + receiveAsFlow() (not StateFlow).","code":null,"tip":"Never use StateFlow for events — re-delivered on config change."},{"id":"iq-8","title":"Rapid Fire Comparisons","concept":"repeatOnLifecycle vs launchWhenStarted (cancels+restarts vs just suspends). remember vs rememberSaveable (lost vs survives config change). Flow vs LiveData (Kotlin-native vs Android-specific). flatMapLatest vs flatMapConcat (cancels vs sequential). @Stable vs @Immutable (mutable+observed vs deeply immutable).","code":null,"tip":"Know the one-sentence difference for each pair."}]}]},{"id":"amit-shekhar-qa","number":17,"title":"Amit Shekhar Q&A","sections":[{"id":"coroutine-internals","title":"Coroutine Internals","cards":[{"id":"as-1","title":"CPS Transformation & suspendCancellableCoroutine","concept":"Compiler transforms suspend functions into state machines with Continuation parameter. suspendCancellableCoroutine bridges callbacks to suspend. Always prefer over suspendCoroutine (supports cancellation via invokeOnCancellation).","code":"suspend fun awaitLocation(): Location =\n    suspendCancellableCoroutine { cont ->\n        val cb = object : LocationCallback() {\n            override fun onLocationResult(r: LocationResult) {\n                if (cont.isActive) cont.resume(r.lastLocation)\n            }\n        }\n        requestLocationUpdates(req, cb, looper)\n        cont.invokeOnCancellation { removeLocationUpdates(cb) }\n    }","tip":"Each suspension point becomes a state transition in the generated state machine."}]},{"id":"kotlin-specific","title":"Kotlin Language","cards":[{"id":"as-2","title":"const vs val, lateinit vs lazy","concept":"const val: compile-time, inlined, primitives+String only. val: runtime, any type.<br>lateinit: deferred var, throws if accessed before init, not for primitives.<br>by lazy: deferred val, thread-safe, computed on first access.","code":"const val API_KEY = \"abc\"  // Compile-time, inlined\nlateinit var adapter: Adapter  // Set in onCreate\nval db by lazy { Room.databaseBuilder(...).build() }  // On first use","tip":"const for true constants. lateinit for lifecycle-dependent init. lazy for expensive objects."},{"id":"as-3","title":"JvmStatic, associateBy, HashMap vs ArrayMap","concept":"@JvmStatic: real static method for Java interop. associateBy: List → Map in O(n). partition: split list in one pass.<br><br>ArrayMap: less memory for < 1000 entries. SparseArray: int→Object, no boxing. HashMap: best for large collections.","code":"val userMap = users.associateBy { it.id } // O(1) lookup\nval (active, inactive) = users.partition { it.isActive }","tip":"associateBy converts API lists to maps for O(1) lookup. Use ArrayMap in memory-sensitive Android contexts."},{"id":"as-4","title":"Serializable vs Parcelable, AIDL","concept":"Serializable: Java standard, reflection (slow). Parcelable: Android-specific, no reflection (10x faster). @Parcelize for auto-generation.<br><br>AIDL: generates Binder boilerplate for cross-process services. Rarely needed in modern Android.","code":"@Parcelize\ndata class Article(val id: String, val title: String) : Parcelable","tip":"Always use @Parcelize. AIDL is for high-frequency cross-process IPC (system services)."}]}]},{"id":"googleyness","number":18,"title":"Googleyness & Leadership","sections":[{"id":"star-framework","title":"STAR Framework","cards":[{"id":"gl-1","title":"STAR Structure","concept":"<b>S</b>ituation (~20s) — team, product, stakes<br><b>T</b>ask (~10s) — YOUR responsibility<br><b>A</b>ction (~60%) — what YOU did, with reasoning<br><b>R</b>esult (~20s) — metrics<br><b>+ Learning</b> (~10s) — what you'd do differently","code":null,"tip":"Say 'I' for your actions. End every answer with a learning. Google interviewers listen for this at L4."},{"id":"gl-2","title":"Story Bank (6–8 Stories)","concept":"Prepare stories that flex to multiple questions:<br>• Mentoring / growing others<br>• Self-initiated impact<br>• Conflict / disagreement<br>• Failure / mistake<br>• Ambiguity / prioritization<br>• Leadership without title<br>• User / quality focus","code":null,"tip":"One story told well beats five shallow ones. Map stories to question categories in 19_googleyness_questions.md."},{"id":"gl-3","title":"Question → Story Mapping","concept":"Collaboration / difficult person → mentoring or conflict story<br>Leadership / influence → leadership-without-title<br>Failure / setback → failure story<br>Initiative / beyond job → self-initiated impact<br>Why Google → career vision + concrete proof story","code":null,"tip":"For reflective questions ('Why Google?'), still ground in a real experience — Google-specific best practice."},{"id":"gl-4","title":"Exemplar: Self-Initiated Impact","concept":"Hook: noticed crash rate rising, nobody assigned.<br>Action: Crashlytics analysis → one-pager → defensive parsing + lifecycle-scoped coroutines.<br>Result: ~40% crash reduction, crash-free sessions &gt; 99.5%.<br>Learning: stability needs same visibility as features.","code":null,"tip":"Include trade-off: borrowed time from roadmap — made explicit to manager upfront."},{"id":"gl-5","title":"Exemplar: Disagreement with Manager","concept":"Manager wanted custom cache; you wanted Room as SSOT.<br>Action: built thin spike comparing both with timelines + trade-offs doc.<br>Result: shipped Room v1 one week later, avoided rewrite next quarter.<br>Learning: disagree with prototype + written trade-offs, not opinions.","code":null,"tip":"See full STAR exemplars in 18_googleyness_and_leadership.md."}]}]},{"id":"dsa-patterns","number":20,"title":"DSA Patterns","sections":[{"id":"dsa-core","title":"Coding Round Patterns","cards":[{"id":"dsa-1","title":"Sliding Window","concept":"Contiguous subarray/substring with constraint.<br>Variable window: expand right, shrink left when invalid.<br><b>Examples:</b> Longest Substring (LC 3), Sliding Window Max (LC 239).","code":null,"tip":"Monotonic deque for window max/min. Very common at Google phone screens."},{"id":"dsa-2","title":"Binary Search Template","concept":"<code>while (lo <= hi)</code> for exact match.<br><code>mid = lo + (hi - lo) / 2</code> — avoids overflow.<br>Rotated array: one half always sorted — check which half contains target.","code":"while (lo <= hi) {\n    val mid = lo + (hi - lo) / 2\n    when {\n        nums[mid] == target -> return mid\n        nums[mid] < target -> lo = mid + 1\n        else -> hi = mid - 1\n    }\n}","tip":"Know cold. Binary search on answer space is follow-up for harder problems."},{"id":"dsa-3","title":"Heap — Top K / Kth Element","concept":"Min-heap of size <b>k</b> for kth largest or top K frequent.<br>Count with HashMap first, then heap on frequency.<br><b>TC:</b> O(n log k)","code":null,"tip":"Google favorite: combines hash map + heap. Mention quickselect O(n) if asked about optimization."},{"id":"dsa-4","title":"Backtracking Template","concept":"Choose → explore → undo (backtrack).<br><b>Subsets:</b> include/exclude at each index.<br><b>Permutations:</b> used[] array, try each unused.<br><b>Grid:</b> DFS + mark visited + undo.","code":"fun backtrack(path: MutableList<Int>) {\n    if (done) { result.add(path.toList()); return }\n    for (choice in choices) {\n        path.add(choice)\n        backtrack(path)\n        path.removeAt(path.lastIndex)\n    }\n}","tip":"Subsets → Permutations → Word Search is the natural progression."},{"id":"dsa-5","title":"Graph Patterns","concept":"<b>DFS/BFS on grid:</b> Number of Islands — mark visited in-place.<br><b>Topological sort:</b> Course Schedule — Kahn's (indegree BFS) or DFS 3-color.<br><b>Tree BFS:</b> Level order with queue size loop.","code":null,"tip":"Islands + Course Schedule cover ~80% of Google graph questions at phone screen level."},{"id":"dsa-6","title":"DP Progression","concept":"1. Recursion (2^n)<br>2. Memoization top-down<br>3. Tabulation bottom-up<br>4. Space optimization (1D array)<br><br>0/1 knapsack: traverse <b>right-to-left</b>. Unbounded: <b>left-to-right</b>.","code":null,"tip":"Target Sum → subset sum. Coin Change 2 → unbounded knapsack. Know the traversal direction difference."},{"id":"dsa-7","title":"Linked List Patterns","concept":"<b>Dummy head</b> simplifies insertion at front.<br><b>Reverse:</b> prev/curr/next three pointers.<br><b>Merge sorted:</b> compare heads, attach smaller.<br>Fast/slow pointers for cycle detection.","code":"var prev: ListNode? = null\nvar curr = head\nwhile (curr != null) {\n    val next = curr.next\n    curr.next = prev\n    prev = curr\n    curr = next\n}","tip":"Reverse Linked List (LC 206) and Merge Two Lists (LC 21) are warm-ups for harder list problems."},{"id":"dsa-8","title":"LRU Cache (Hard)","concept":"HashMap for O(1) lookup + <b>doubly linked list</b> for O(1) eviction.<br>On get/put: move node to front. On capacity: remove tail.<br>Google favorite — tests data structure design.","code":null,"tip":"Explain WHY HashMap alone isn't enough — need ordering for 'least recently used'. LC 146."},{"id":"dsa-9","title":"Serialize Binary Tree","concept":"Preorder with <code>#</code> null markers — unambiguous.<br>Deserialize: consume tokens left-to-right recursively.<br>BFS level-order is alternative — know both.","code":"fun serialize(root: TreeNode?): String {\n    if (root == null) return \"#\"\n    return \"${root.val},${serialize(root.left)},${serialize(root.right)}\"\n}","tip":"LC 297 — common onsite question. Preorder+null is easiest to code under pressure."}]}]}];
const STORAGE_KEY="android-prep-progress";let state=loadState();function loadState(){try{const s=localStorage.getItem(STORAGE_KEY);if(s){const p=JSON.parse(s);return{cardStatuses:p.cardStatuses||{},currentTopicIdx:p.currentTopicIdx||0,currentCardIdx:p.currentCardIdx||0,darkMode:p.darkMode!==undefined?p.darkMode:true}}}catch(e){}return{cardStatuses:{},currentTopicIdx:0,currentCardIdx:0,darkMode:true}}let saveTimeout;function saveState(){clearTimeout(saveTimeout);saveTimeout=setTimeout(()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))},300)}function getTopicCards(t){const c=[];t.sections.forEach(s=>s.cards.forEach(card=>c.push({...card,sectionTitle:s.title,topicTitle:t.title})));return c}function getAllCards(){const a=[];TOPICS.forEach(t=>a.push(...getTopicCards(t)));return a}const allCards=getAllCards(),totalCards=allCards.length;function getMasteredCount(){return Object.values(state.cardStatuses).filter(s=>s==="mastered").length}function getTopicStats(topic){const cards=getTopicCards(topic),total=cards.length;let mastered=0,revisit=0;cards.forEach(c=>{const s=state.cardStatuses[c.id];if(s==="mastered")mastered++;else if(s==="revisit")revisit++});let status="untouched";if(mastered===total)status="done";else if(mastered>0||revisit>0)status="in-progress";return{total,mastered,status}}function highlightKotlin(code){if(!code)return"";return code.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/(\/\/.*)/g,'<span class="cmt">$1</span>').replace(/(@\w+)/g,'<span class="ann">$1</span>').replace(/\b(fun|val|var|class|object|interface|data|sealed|enum|override|suspend|return|if|else|when|is|in|for|while|try|catch|finally|throw|import|package|private|public|protected|internal|abstract|open|companion|inline|reified|crossinline|noinline|operator|infix|lateinit|by|lazy|const|get|set|init|constructor|super|this|true|false|null|as|typealias|out|where|it)\b/g,'<span class="kw">$1</span>').replace(/\b(String|Int|Long|Boolean|Float|Double|Unit|Any|Nothing|List|Map|Set|Flow|StateFlow|SharedFlow|MutableStateFlow|Channel|Deferred|Job|CoroutineScope|Result|Pair|Triple|Bitmap|Context|Bundle|Intent|View|Modifier|Composable)\b/g,'<span class="type">$1</span>').replace(/\b(\d+[Lf]?)\b/g,'<span class="num">$1</span>').replace(/"([^"\\]|\\.)*"/g,'<span class="str">$&</span>')}function renderSidebar(){const list=document.getElementById("topicList");list.innerHTML=TOPICS.map((t,i)=>{const s=getTopicStats(t),a=i===state.currentTopicIdx?"active":"",d=s.status==="done"?"done":s.status==="in-progress"?"in-progress":"";return`<div class="topic-item ${a}" data-idx="${i}"><span class="topic-num">${t.number}</span><div class="status-dot ${d}"></div><span class="topic-title">${t.title}</span><span class="topic-progress">${s.mastered}/${s.total}</span></div>`}).join("");list.querySelectorAll(".topic-item").forEach(item=>{item.addEventListener("click",()=>{state.currentTopicIdx=parseInt(item.dataset.idx);state.currentCardIdx=0;saveState();renderAll();closeSidebar()})})}function renderProgressBar(){const m=getMasteredCount(),p=totalCards>0?(m/totalCards*100):0;document.getElementById("progressFill").style.width=p+"%";document.getElementById("progressText").innerHTML=`<b>${m}</b> / ${totalCards} concepts mastered`}let lastDir="forward";function renderCard(){const topic=TOPICS[state.currentTopicIdx],cards=getTopicCards(topic);if(!cards.length){document.getElementById("cardArea").innerHTML="<p>No cards</p>";return}const idx=Math.min(state.currentCardIdx,cards.length-1);state.currentCardIdx=idx;const card=cards[idx],cId="code-"+card.id,tId="tip-"+card.id,dc=lastDir==="back"?"reverse":"";let h=`<div class="card-wrapper ${dc}"><div class="section-badge">${card.sectionTitle}</div><div class="card"><h2>${card.title}</h2><div class="card-concept">${card.concept}</div>`;if(card.code)h+=`<button class="toggle-btn" id="codeBtn" onclick="toggleSection('${cId}',this)">&#9654; Show Code</button>`;if(card.tip)h+=`<button class="toggle-btn" id="tipBtn" onclick="toggleSection('${tId}',this)">&#128161; Show Interview Tip</button>`;if(card.code)h+=`<div class="collapsible" id="${cId}"><div class="code-block">${highlightKotlin(card.code)}</div></div>`;if(card.tip)h+=`<div class="collapsible" id="${tId}"><div class="tip-box">${card.tip}</div></div>`;h+=`<div class="card-footer"><div class="action-buttons"><button class="action-btn got-it" onclick="markCard('mastered')">Got It (G)</button><button class="action-btn revisit" onclick="markCard('revisit')">Revisit (R)</button></div><div class="nav-controls"><button class="nav-btn" onclick="prevCard()" ${idx===0?"disabled":""}>&larr;</button><span class="card-counter">${idx+1} / ${cards.length}</span><button class="nav-btn" onclick="nextCard()" ${idx===cards.length-1?"disabled":""}>&rarr;</button></div></div></div></div>`;document.getElementById("cardArea").innerHTML=h;document.getElementById("cardArea").scrollTop=0}function toggleSection(id,btn){const el=document.getElementById(id);if(!el)return;el.classList.toggle("open");if(btn)btn.classList.toggle("active")}function markCard(status){const topic=TOPICS[state.currentTopicIdx],cards=getTopicCards(topic),card=cards[state.currentCardIdx];state.cardStatuses={...state.cardStatuses,[card.id]:status};saveState();if(state.currentCardIdx<cards.length-1){lastDir="forward";state.currentCardIdx++;saveState()}renderAll()}function nextCard(){const cards=getTopicCards(TOPICS[state.currentTopicIdx]);if(state.currentCardIdx<cards.length-1){lastDir="forward";state.currentCardIdx++;saveState();renderCard()}}function prevCard(){if(state.currentCardIdx>0){lastDir="back";state.currentCardIdx--;saveState();renderCard()}}function progressiveReveal(){const topic=TOPICS[state.currentTopicIdx],cards=getTopicCards(topic),card=cards[state.currentCardIdx];if(card.code){const el=document.getElementById("code-"+card.id);if(el&&!el.classList.contains("open")){toggleSection("code-"+card.id,document.getElementById("codeBtn"));return}}if(card.tip){const el=document.getElementById("tip-"+card.id);if(el&&!el.classList.contains("open")){toggleSection("tip-"+card.id,document.getElementById("tipBtn"));return}}nextCard()}function renderAll(){renderSidebar();renderProgressBar();renderCard()}function applyTheme(){document.body.classList.toggle("light-mode",!state.darkMode)}function toggleTheme(){state.darkMode=!state.darkMode;applyTheme();saveState()}function openSidebar(){document.getElementById("sidebar").classList.add("open");document.getElementById("sidebarOverlay").classList.add("open")}function closeSidebar(){document.getElementById("sidebar").classList.remove("open");document.getElementById("sidebarOverlay").classList.remove("open")}document.getElementById("resetBtn").addEventListener("click",()=>{document.getElementById("confirmOverlay").classList.add("open")});document.getElementById("confirmCancel").addEventListener("click",()=>{document.getElementById("confirmOverlay").classList.remove("open")});document.getElementById("confirmReset").addEventListener("click",()=>{state={cardStatuses:{},currentTopicIdx:0,currentCardIdx:0,darkMode:state.darkMode};saveState();document.getElementById("confirmOverlay").classList.remove("open");renderAll()});document.getElementById("hamburgerBtn").addEventListener("click",openSidebar);document.getElementById("sidebarOverlay").addEventListener("click",closeSidebar);document.addEventListener("keydown",(e)=>{if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;switch(e.key){case"ArrowRight":case"ArrowDown":e.preventDefault();nextCard();break;case"ArrowLeft":case"ArrowUp":e.preventDefault();prevCard();break;case" ":e.preventDefault();progressiveReveal();break;case"g":case"G":markCard("mastered");break;case"r":case"R":markCard("revisit");break;case"d":case"D":toggleTheme();break}});applyTheme();renderAll();
